[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pubify-mpl"
version = "1.2.0"
description = "Publication-oriented Matplotlib figure preparation and export helpers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "matplotlib>=3.8",
]

[project.urls]
Homepage = "https://github.com/nvnunes/pubify-mpl"
Documentation = "https://nvnunes.github.io/pubify-mpl/"
Repository = "https://github.com/nvnunes/pubify-mpl"
Issues = "https://github.com/nvnunes/pubify-mpl/issues"
Changelog = "https://github.com/nvnunes/pubify-mpl/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "build>=1.2",
  "mkdocs>=1.6",
  "mkdocstrings[python]>=0.30",
  "twine>=5.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.exclude-package-data]
"*" = [".DS_Store"]
